name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  validate:
    name: Validar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar archivos necesarios
        run: |
          set -euo pipefail
          missing=0
          for f in \
            site/index.html \
            site/404.html \
            site/robots.txt \
            site/sitemap.xml \
            site/assets/css/styles.css \
            site/assets/js/main.js \
            site/assets/brand/logo-mark.png \
            site/assets/brand/og-image.png \
            Dockerfile \
            compose.yaml \
            docker/nginx.conf ; do
            if [ ! -f "$f" ]; then echo "FALTA: $f"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "Todos los archivos necesarios existen."

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validar estructura del sitio
        run: node tools/validate-site.js site

      - name: Validar HTML
        run: npx --yes html-validate@9 "site/index.html" "site/404.html"

  build:
    name: Construir y publicar
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ASSET_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'
    runs-on: [self-hosted, hapmed]
    environment:
      name: production
    concurrency:
      group: deploy-hapmed-web
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sincronizar artefactos de despliegue
        run: |
          set -euo pipefail
          install -m 644 deploy/compose.prod.yaml /opt/apps/hapmed-web/compose.prod.yaml
          install -m 755 deploy/deploy.sh /opt/apps/hapmed-web/deploy.sh

      - name: Desplegar
        run: |
          set -euo pipefail
          cd /opt/apps/hapmed-web
          HAPMED_PORT=8080 IMAGE_REF="${{ env.IMAGE }}:${{ github.sha }}" bash deploy.sh

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Despliegue HAPMED Web (homelab)"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Imagen: \`${{ env.IMAGE }}:${{ github.sha }}\`"
            echo "- Resultado: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
